<!DOCTYPE html>
<html lang="id">
<head>

<!-- Menentukan karakter encoding agar mendukung berbagai simbol -->
<meta charset="UTF-8">

<!-- Judul halaman yang tampil di tab browser -->
<title>Form Interaktif Modern</title>

<style>

/* Mengatur tampilan body halaman */
body{
font-family: Arial, sans-serif; /* Menggunakan font Arial */
background: linear-gradient(135deg,#ff00d4,#b87af6); /* Memberi background gradasi */
height:100vh; /* Tinggi halaman 100% layar */
display:flex; /* Menggunakan flexbox */
justify-content:center; /* Posisi horizontal di tengah */
align-items:center; /* Posisi vertikal di tengah */
flex-direction:column; /* Elemen disusun vertikal */
color:white; /* Warna teks putih */
text-align:center; /* Teks rata tengah */
}

/* Mengatur tampilan kotak form */
.container{
background:white; /* Background putih */
color:black; /* Warna teks hitam */
padding:35px; /* Jarak isi ke tepi */
border-radius:15px; /* Membuat sudut kotak melengkung */
box-shadow:0 10px 25px rgba(0,0,0,0.3); /* Memberi bayangan */
width:300px; /* Lebar kotak */
animation:fadeIn 1s ease; /* Animasi muncul saat halaman dibuka */
}

/* Mengatur tampilan input dan tombol */
input{
padding:12px; /* Jarak dalam */
margin-top:10px; /* Jarak atas */
width:100%; /* Lebar penuh */
border-radius:6px; /* Sudut melengkung */
border:1px solid #ccc; /* Border abu */
font-size:16px; /* Ukuran font */
}

/* Mengatur tampilan tombol */
button{
margin-top:15px;
padding:12px;
width:100%;
border:none; /* Menghilangkan border */
border-radius:6px;
background:#667eea; /* Warna tombol */
color:white; /* Warna teks */
font-size:16px;
cursor:pointer; /* Mengubah cursor jadi tangan */
transition:0.3s; /* Animasi transisi */
}









</style>

</head>

<body>










</form>

</div>





</body>
</html>
